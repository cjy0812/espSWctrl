[package]
name = "powerswitch"
version = "0.1.0"
edition = "2021"
resolver = "2"

# 不发布，纯固件
publish = false

# 显式声明自己是 workspace root。
# `CARGO_WORKSPACE_DIR`（.cargo/config.toml）依赖它定位仓库根，
# 去掉这段 embuild 会算错 workspace 根，静默无视 sdkconfig.defaults。
[workspace]
members = ["."]

[dependencies]
esp-idf-svc = "0.53"
log = "0.4"

[build-dependencies]
# esp-idf-sys 的构建脚本依赖这个来把 IDF 的环境变量导给 rustc。
embuild = "0.33"

# ---- size profile ----
# 历史体积探针数据已过时，不作为当前固件预算依据。
# 当前 factory 分区上限由 CI 按 0x180000（1500 KiB）强制检查；
# README.md 记录最近一次人工测量值，实际产物以对应 CI artifact 为准。
# 变更 release profile 或依赖后，应重新测量并同步 README.md。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false

# 别用默认 dev —— 未优化体积能到几十 MB，烧都烧不进去
[profile.dev]
opt-level = "z"
debug = false

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig = "sdkconfig"
esp_idf_version = "6.1"
