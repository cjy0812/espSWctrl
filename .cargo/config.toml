[build]
# ESP32-C3 是 RISC-V，走上游 target 就够，不需要 espup 的 Xtensa fork。
target = "riscv32imc-esp-espidf"

[target.riscv32imc-esp-espidf]
# ldproxy 负责把 rustc 的链接调用翻译成 IDF 的链接脚本 + 组件列表。
linker = "ldproxy"
# 本机没装 espflash（cargo bin 里没有）。烧录用 IDF 自带 esptool：
#   %IDF_PYTHON_ENV_PATH%\Scripts\python.exe -m esptool --chip esp32c3 -p COM3 ...
# 想用 `cargo run` 一键烧录再 `cargo install espflash`（下面的 runner 是模板，
# 端口按实际改；本机板子是 ESP32-C3 原生 USB-Serial-JTAG，不是 CP210x）：
# runner = "espflash flash --monitor --chip esp32c3 --port COM3"

[unstable]
# stable 编不了 esp target（can't find crate for `core`），必须 build-std。
build-std = ["std", "panic_abort"]
# 注：故意【不】开 panic_immediate_abort。
# 它能再省 ~10-20%，但会把 panic 信息一起抹掉 —— 这是一个
# 安全相关设备（GPIO 卡高会强断电），出问题时串口上那行 panic
# 比几百 KB flash 值钱得多。体积真不够时再回来开。

[env]
# ⚠️ 这一行不是可选的，去掉它整个构建会静默用错配置。
#
# embuild::cargo::workspace_dir()（embuild-0.33.2/src/cargo.rs:432）在
# CARGO_WORKSPACE_DIR 未设置时，靠从 OUT_DIR 往上 pop 6 层来猜 workspace 根。
# 我们为绕开 esp-idf-sys 的 Windows 路径长度限制，把 target 搬到了 G:/tmp/p，
# 于是 pop 6 层算出来是 G:/tmp/p —— 而不是 G:\GitHub\espSWctrl。
#
# 后果（实测，2026-10-17）：esp-idf-sys 去 G:/tmp/p 找 sdkconfig / sdkconfig.defaults，
# 找不到就退回 IDF 纯默认值，仓库里两份配置全部被无视：
#   * 分区表回落成 partitions_singleapp.csv —— app 分区只有 1MB 而不是 1500K
#   * 主控制台回落成 UART0，板子的 USB-Serial-JTAG 降级为「副控制台」，
#     只出不进 → Phase 2 的 REPL 在 COM11 上敲不进任何命令
#     → 且 bindgen 因此不导出 esp_console_new_repl_usb_serial_jtag（E0425）
# 这正是 esp-idf-sys 的 BUILD-OPTIONS.md:113-124 描述的情形，按其解法设置：
# relative=true + 空值 = 以 .cargo/ 的父目录为根，即 crate 根。
CARGO_WORKSPACE_DIR = { value = "", relative = true }

# 让 esp-idf-sys 的构建脚本生成带 espressif/mqtt 的 idf_component.yml。
# 不设这个变量时 esp-idf-sys 不会写 idf_component.yml（cargo_driver.rs:370-388
# 无 remote component 时会 remove_file），esp-mqtt 因此不会进构建。
# relative=true 让它以 crate 根为基准解析，绝对/相对路径都能用；
# force=true 防止被外部环境覆盖。
# ⚠️ 只改 extra-components.toml 的内容不会触发 build script 重跑，
# 只有改这个变量的值才会（track_env_var）。升级 mqtt 版本时要清
# $CARGO_TARGET_DIR/riscv32imc-esp-espidf/release/build/esp-idf-sys。
ESP_IDF_SYS_EXTRA_COMPONENTS_FILE = { value = "extra-components.toml", relative = true, force = true }