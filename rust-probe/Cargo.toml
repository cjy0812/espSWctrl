[package]
name = "rust-probe"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
esp-idf-svc = "0.53"
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = "0.33"

# 与最终固件一致的 size profile —— 探针量出来的体积才有意义
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false

[profile.dev]
opt-level = "z"
debug = false

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig = "sdkconfig.probe"
esp_idf_version = "6.1"

# mqtt 自 ESP-IDF v6.0 起移出主体。C 工程用 idf_component.yml 拉；
# Rust 侧由 esp-idf-sys 的 extra_components 机制生成同样的 idf_component.yml。
# 这里用 path 直接指向 C 工程已下载好的那份，省一次网络往返。
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mqtt", version = "1.1.0", path = "../managed_components/espressif__mqtt" }
