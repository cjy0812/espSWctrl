name: ESP-IDF Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Match the version used by cargo-build.cmd on Windows.
  ESP_IDF_VERSION: 6.1.0

jobs:
  linux-build:
    name: Ubuntu / ESP32-C3
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            libclang-dev \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            wget \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-20
          components: rust-src, rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install ldproxy
        run: cargo install ldproxy --locked

      # Linux uses esp-idf-sys/embuild's native tool installation.
      # Do not set ESP_IDF_TOOLS_INSTALL_DIR=fromenv here: unlike the Windows
      # wrapper, the GitHub runner starts without a pre-installed ESP-IDF.
      - name: Cargo check
        run: cargo check --locked

      - name: Release build
        run: cargo build --release --locked
