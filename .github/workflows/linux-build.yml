name: ESP-IDF Rust 构建验证

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # ESP-IDF 上游正式标签是 v6.1，而不是 v6.1.0。
  ESP_IDF_VERSION: tag:v6.1
  # ESP32-C3 使用 RISC-V target；显式指定 MCU，避免 esp-idf-sys 自动推断。
  MCU: esp32c3

jobs:
  linux-build:
    name: Ubuntu / ESP32-C3 构建
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            clang \
            libclang-dev \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            git \
            wget \
            flex \
            bison \
            gperf \
            ccache \
            libffi-dev \
            libssl-dev

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-09-20
          components: rust-src, rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装 ldproxy
        run: cargo install ldproxy --locked

      # Linux 使用 esp-idf-sys/embuild 原生安装 ESP-IDF 工具链。
      # 不设置 ESP_IDF_TOOLS_INSTALL_DIR=fromenv：Runner 初始没有预装 ESP-IDF。
      - name: Cargo 检查
        run: cargo check --locked

      - name: Release 编译
        run: cargo build --release --locked
